<!DOCTYPE html>
<html lang="it">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a5f" />
    <title>Stippo — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f3f1ec;
        color: #141414;
        padding: 24px;
        text-align: center;
      }
      h1 { font-weight: 500; font-size: 1.75rem; }
      p { color: #666; max-width: 28rem; line-height: 1.45; }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        background: #1e3a5f;
        color: #fff;
        text-decoration: none;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Stippo is offline</h1>
      <p>
        Il vault locale resta sul dispositivo. Riconnettiti per sync e AI tagging.

      </p>
      <a href="/app">Riprova</a>
    </div>
