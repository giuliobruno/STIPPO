packages:
  - "."

# pnpm 11+: approve lifecycle scripts via allowBuilds (replaces onlyBuiltDependencies).
# Without this, Vercel fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  sharp: true
  esbuild: true
  unrs-resolver: true

strictDepBuilds: true
ignoreScripts: false

# pnpm 11 blocks packages younger than ~24h (supply-chain protection).
minimumReleaseAgeExclude:
  - openai
  - "@capacitor/cli"
  - "@capacitor/core"
